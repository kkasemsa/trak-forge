name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npm test

  ios:
    # Compiles the app and the CoreMIDI plugin for the iOS Simulator, unsigned.
    # It proves the Swift builds; it cannot prove the app talks to a SEQTRAK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npm run app:sync
      - name: Build
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
          exit ${PIPESTATUS[0]}
